name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node apps/cli/dist/index.js workflow validate workflows/feature.yaml
      - name: Smoke test workflow lifecycle CLI
        shell: bash
        run: |
          output="$(node apps/cli/dist/index.js workflow run workflows/feature.yaml --input 'feature_description=CI lifecycle smoke test')"
          echo "$output"
          run_id="$(printf '%s\n' "$output" | sed -n 's/^Run: //p' | head -n 1)"
          test -n "$run_id"
          node apps/cli/dist/index.js workflow status "$run_id"
          node apps/cli/dist/index.js workflow pause "$run_id"
          node apps/cli/dist/index.js workflow resume "$run_id" --file workflows/feature.yaml
          node apps/cli/dist/index.js workflow cancel "$run_id"

