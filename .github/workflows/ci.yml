name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/release/check-version.mjs v0.1.0
      - name: Verify publishable workspace tarballs
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.artifacts"
          (cd packages/core && pnpm pack --pack-destination "$GITHUB_WORKSPACE/.artifacts")
          (cd packages/schemas && pnpm pack --pack-destination "$GITHUB_WORKSPACE/.artifacts")
          (cd packages/adapters && pnpm pack --pack-destination "$GITHUB_WORKSPACE/.artifacts")
          (cd apps/cli && pnpm pack --pack-destination "$GITHUB_WORKSPACE/.artifacts")
          tar -tzf "$GITHUB_WORKSPACE/.artifacts/aether-cli-0.1.0.tgz" | grep -q 'package/dist/bundles/skills/project/project-onboarding/SKILL.md'
          tar -tzf "$GITHUB_WORKSPACE/.artifacts/aether-cli-0.1.0.tgz" | grep -q 'package/dist/bundles/workflows/feature.yaml'
          tar -xOf "$GITHUB_WORKSPACE/.artifacts/aether-cli-0.1.0.tgz" package/package.json | grep -q '"@aether/core": "0.1.0"'
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/.artifacts/aether-core-0.1.0.tgz" \
            "$GITHUB_WORKSPACE/.artifacts/aether-schemas-0.1.0.tgz" \
            "$GITHUB_WORKSPACE/.artifacts/aether-adapters-0.1.0.tgz" \
            "$GITHUB_WORKSPACE/.artifacts/aether-cli-0.1.0.tgz"
          npx --no-install aether --version
          npx --no-install aether init --platform generic
          test -f ".agents/skills/project-onboarding/SKILL.md"
          test -f "workflows/aether/feature.yaml"
          npx --no-install aether workflow list
      - run: node apps/cli/dist/index.js workflow validate workflows/feature.yaml
      - run: node apps/cli/dist/index.js workflow list workflows
      - name: Validate bundled workflows
        shell: bash
        run: |
          for workflow in workflows/*.yaml workflows/*.yml; do
            test -f "$workflow" || continue
            node apps/cli/dist/index.js workflow validate "$workflow"
          done
      - run: node apps/cli/dist/index.js skill validate skills
      - run: node apps/cli/dist/index.js platform list
      - run: node apps/cli/dist/index.js platform detect --project .
      - name: Smoke test local context retrieval
        shell: bash
        run: |
          output="$(node apps/cli/dist/index.js context search 'workflow recovery' --limit 5 --max-chars 6000)"
          echo "$output"
          printf '%s\n' "$output" | grep -q 'docs/architecture/workflow-recovery.md'

      - name: Smoke test documentation link audit
        shell: bash
        run: |
          output="$(node apps/cli/dist/index.js docs audit)"
          echo "$output"
          printf '%s\n' "$output" | grep -q 'No broken internal links found.'

      - name: Smoke test project initialization and doctor
        shell: bash
        run: |
          project_dir="$(mktemp -d)"
          node apps/cli/dist/index.js init --project "$project_dir" --skills "$GITHUB_WORKSPACE/skills" --workflows "$GITHUB_WORKSPACE/workflows" --platform codex --platform gemini-cli
          node apps/cli/dist/index.js doctor --project "$project_dir"
          test -f "$project_dir/.agents/skills/project-onboarding/SKILL.md"
          test -f "$project_dir/workflows/aether/feature.yaml"
          test -f "$project_dir/.aether/managed-files.json"
          node apps/cli/dist/index.js update --project "$project_dir" --skills "$GITHUB_WORKSPACE/skills" --workflows "$GITHUB_WORKSPACE/workflows"
          node apps/cli/dist/index.js uninstall --project "$project_dir"
          test -f "$project_dir/.aether/config.yaml"
          test ! -f "$project_dir/.agents/skills/project-onboarding/SKILL.md"
          test ! -f "$project_dir/workflows/aether/feature.yaml"

      - name: Smoke test workflow lifecycle CLI
        shell: bash
        run: |
          output="$(node apps/cli/dist/index.js workflow run workflows/feature.yaml --input 'feature_description=CI lifecycle smoke test')"
          echo "$output"
          run_id="$(printf '%s\n' "$output" | sed -n 's/^Run: //p' | head -n 1)"
          test -n "$run_id"
          fake_agent_dir="$(mktemp -d)"
          cat > "$fake_agent_dir/codex" <<'NODE'
          #!/usr/bin/env node
          const fs = require("node:fs");
          const path = require("node:path");
          const taskPath = process.env.AETHER_TEST_TASK_PATH;
          if (!taskPath) process.exit(2);
          const task = JSON.parse(fs.readFileSync(taskPath, "utf8"));
          const taskDirectory = path.dirname(taskPath);
          const outputDirectory = path.join(taskDirectory, "output");
          fs.mkdirSync(outputDirectory, { recursive: true });
          const evidencePath = path.join(outputDirectory, "test-report.txt");
          fs.writeFileSync(evidencePath, "CI evidence: interactive launch adapter created this report.\n");
          const result = {
            schema_version: 1,
            task_id: task.task_id,
            run_id: task.run_id,
            stage_id: task.stage_id,
            summary: "CI smoke test completed the discovery launch.",
            changed_files: [],
            evidence: [{
              path: path.relative(process.cwd(), evidencePath).split(path.sep).join("/"),
              type: "test_report",
              result: "passed",
              summary: "The fake native CLI produced a non-empty evidence fixture."
            }]
          };
          fs.writeFileSync(path.join(taskDirectory, "result.json"), JSON.stringify(result, null, 2));
          NODE
          chmod +x "$fake_agent_dir/codex"
          export PATH="$fake_agent_dir:$PATH"
          export AETHER_TEST_TASK_PATH="$GITHUB_WORKSPACE/.aether/handoffs/$run_id/discovery/task.json"
          node apps/cli/dist/index.js workflow launch "$run_id" --file workflows/feature.yaml --adapter codex --stage discovery
          test -s ".aether/handoffs/$run_id/discovery/HANDOFF.md"
          test -s ".aether/handoffs/$run_id/discovery/CONTEXT.md"
          grep -q 'CONTEXT.md' ".aether/handoffs/$run_id/discovery/HANDOFF.md"
          test -f ".aether/handoffs/$run_id/discovery/result.json"
          node apps/cli/dist/index.js workflow accept "$run_id" --file workflows/feature.yaml --stage discovery --result ".aether/handoffs/$run_id/discovery/result.json"
          node apps/cli/dist/index.js workflow status "$run_id"
          node apps/cli/dist/index.js workflow pause "$run_id"
          node apps/cli/dist/index.js workflow resume "$run_id" --file workflows/feature.yaml
          node apps/cli/dist/index.js workflow cancel "$run_id"

      - name: Smoke test workflow approval gates
        shell: bash
        run: |
          node apps/cli/dist/index.js trust keygen --id ci-maintainer
          node apps/cli/dist/index.js trust register --id ci-maintainer --public-key .aether/keys/ci-maintainer.public.pem --roles maintainer
          node apps/cli/dist/index.js trust list
          node apps/cli/dist/index.js trust validate
          approval_workflow="$RUNNER_TEMP/aether-approval-workflow.yaml"
          cat > "$approval_workflow" <<'YAML'
          schema_version: 1
          id: ci-approval-gate
          version: 1
          name: CI Approval Gate
          description: Exercise a required signed approval gate.
          inputs: []
          stages:
            - id: protected-change
              skill: implementation
              required: true
              approval:
                mode: required
                risk: high
                require_signature: true
                allowed_approvers: [ci-maintainer]
                required_roles: [maintainer]
                prevent_self_approval: true
          completion:
            required_stages:
              - protected-change
          YAML
          output="$(node apps/cli/dist/index.js workflow run "$approval_workflow")"
          echo "$output"
          approval_run_id="$(printf "%s\n" "$output" | sed -n "s/^Run: //p" | head -n 1)"
          test -n "$approval_run_id"
          printf "%s\n" "$output" | grep -q "awaiting_approval"
          node apps/cli/dist/index.js workflow approve "$approval_run_id" --file "$approval_workflow" --stage protected-change --by ci-maintainer --key .aether/keys/ci-maintainer.private.pem --reason "CI approval-gate smoke test"
          status="$(node apps/cli/dist/index.js workflow status "$approval_run_id")"
          echo "$status"
          printf "%s\n" "$status" | grep -q "protected-change.*ready"
          node -e 'const fs=require("node:fs"); const id=process.argv[1]; const run=JSON.parse(fs.readFileSync(".aether/runs/"+id+"/run.json","utf8")); const events=fs.readFileSync(".aether/runs/"+id+"/events.jsonl","utf8").trim().split("\n").map(JSON.parse); const decision=events.map(e=>e.payload?.approval).find(a=>a?.status==="approved"); if(!decision?.decision_signature || decision.decision_signature.algorithm!=="ed25519" || decision.decision_signature.key_id!=="ci-maintainer") process.exit(1); if(run.stages["protected-change"].status!=="ready") process.exit(1);' "$approval_run_id"
