name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify publishable workspace tarballs
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.artifacts"
          pnpm --filter @aether/core pack --pack-destination "$GITHUB_WORKSPACE/.artifacts"
          pnpm --filter @aether/schemas pack --pack-destination "$GITHUB_WORKSPACE/.artifacts"
          pnpm --filter @aether/adapters pack --pack-destination "$GITHUB_WORKSPACE/.artifacts"
          pnpm --filter @aether/cli pack --pack-destination "$GITHUB_WORKSPACE/.artifacts"
          tar -tzf "$GITHUB_WORKSPACE/.artifacts/aether-cli-0.1.0.tgz" | grep -q 'package/dist/bundles/skills/project/project-onboarding/SKILL.md'
          tar -tzf "$GITHUB_WORKSPACE/.artifacts/aether-cli-0.1.0.tgz" | grep -q 'package/dist/bundles/workflows/feature.yaml'
          tar -xOf "$GITHUB_WORKSPACE/.artifacts/aether-cli-0.1.0.tgz" package/package.json | grep -q '"@aether/core": "0.1.0"'
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/.artifacts/aether-core-0.1.0.tgz" \
            "$GITHUB_WORKSPACE/.artifacts/aether-schemas-0.1.0.tgz" \
            "$GITHUB_WORKSPACE/.artifacts/aether-adapters-0.1.0.tgz" \
            "$GITHUB_WORKSPACE/.artifacts/aether-cli-0.1.0.tgz"
          npx --no-install aether --version
          npx --no-install aether init --platform generic
          test -f ".agents/skills/project-onboarding/SKILL.md"
          test -f "workflows/aether/feature.yaml"
          npx --no-install aether workflow list
      - run: node apps/cli/dist/index.js workflow validate workflows/feature.yaml
      - run: node apps/cli/dist/index.js workflow list workflows
      - name: Validate bundled workflows
        shell: bash
        run: |
          for workflow in workflows/*.yaml workflows/*.yml; do
            test -f "$workflow" || continue
            node apps/cli/dist/index.js workflow validate "$workflow"
          done
      - run: node apps/cli/dist/index.js skill validate skills
      - run: node apps/cli/dist/index.js platform list
      - run: node apps/cli/dist/index.js platform detect --project .
      - name: Smoke test project initialization and doctor
        shell: bash
        run: |
          project_dir="$(mktemp -d)"
          node apps/cli/dist/index.js init --project "$project_dir" --skills "$GITHUB_WORKSPACE/skills" --workflows "$GITHUB_WORKSPACE/workflows" --platform codex --platform gemini-cli
          node apps/cli/dist/index.js doctor --project "$project_dir"
          test -f "$project_dir/.agents/skills/project-onboarding/SKILL.md"
          test -f "$project_dir/workflows/aether/feature.yaml"
          test -f "$project_dir/.aether/managed-files.json"
          node apps/cli/dist/index.js update --project "$project_dir" --skills "$GITHUB_WORKSPACE/skills" --workflows "$GITHUB_WORKSPACE/workflows"
          node apps/cli/dist/index.js uninstall --project "$project_dir"
          test -f "$project_dir/.aether/config.yaml"
          test ! -f "$project_dir/.agents/skills/project-onboarding/SKILL.md"
          test ! -f "$project_dir/workflows/aether/feature.yaml"

      - name: Smoke test workflow lifecycle CLI
        shell: bash
        run: |
          output="$(node apps/cli/dist/index.js workflow run workflows/feature.yaml --input 'feature_description=CI lifecycle smoke test')"
          echo "$output"
          run_id="$(printf '%s\n' "$output" | sed -n 's/^Run: //p' | head -n 1)"
          test -n "$run_id"
          node apps/cli/dist/index.js workflow handoff "$run_id" --file workflows/feature.yaml --adapter generic
          test -f ".aether/handoffs/$run_id/discovery/HANDOFF.md"
          mkdir -p ".aether/handoffs/$run_id/discovery/output"
          printf 'CI evidence: discovery artifact created\n' > ".aether/handoffs/$run_id/discovery/output/test-report.txt"
          node - ".aether/handoffs/$run_id/discovery/task.json" ".aether/handoffs/$run_id/discovery/result.json" "$run_id" <<'NODE'
          const fs = require("node:fs");
          const task = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const runId = process.argv[4];
          const result = {
            schema_version: 1,
            task_id: task.task_id,
            run_id: task.run_id,
            stage_id: task.stage_id,
            summary: "CI smoke test completed the discovery handoff.",
            changed_files: [],
            evidence: [{
              path: ".aether/handoffs/" + runId + "/discovery/output/test-report.txt",
              type: "test_report",
              result: "passed",
              summary: "CI created this non-empty evidence fixture."
            }]
          };
          fs.writeFileSync(process.argv[3], JSON.stringify(result, null, 2));
          NODE
          node apps/cli/dist/index.js workflow accept "$run_id" --file workflows/feature.yaml --stage discovery --result ".aether/handoffs/$run_id/discovery/result.json"
          node apps/cli/dist/index.js workflow status "$run_id"
          node apps/cli/dist/index.js workflow pause "$run_id"
          node apps/cli/dist/index.js workflow resume "$run_id" --file workflows/feature.yaml
          node apps/cli/dist/index.js workflow cancel "$run_id"

